[workspace]
resolver = "2"
members = [
    "crates/dq-core",
    "crates/dq-ingest",
    "crates/dq-index",
    "crates/dq-llm",
    "crates/dq-guard",
    "crates/dq-rag",
    "crates/dq-server",
]
exclude = ["crates/dq-web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Proprietary"
authors = ["doc-qa-system"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"
async-trait = "0.1"
futures = "0.3"
parking_lot = "0.12"
rayon = "1"
sha2 = "0.10"
blake3 = "1"
toml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled", "chrono", "serde_json"] }
image = "0.25"
unicode-normalization = "0.1"
