services:
  ollama:
    image: ollama/ollama:latest
    container_name: dqa-ollama
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & sleep 3 && ollama pull qwen2.5:0.5b && wait"]
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_DEBUG=0
      - OLLAMA_NUM_THREAD=6
      - OLLAMA_CONTEXT_LENGTH=1024
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - dqa-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  dq-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dqa-server
    restart: unless-stopped
    environment:
      DQ_SERVER_HOST: "0.0.0.0"
      DQ_SERVER_PORT: "8080"
      DQ_JWT_SECRET: "${DQA_JWT_SECRET}"
      DQ_DB_PATH: "/app/data/docqa.sqlite3"
      DQ_MODEL_DIR: "/app/models"
      DQ_EMBEDDING_OFFLINE: "true"
      DQ_OCR_ENGINE: "tesseract"
      DQ_LLM_BASE_URL: "http://ollama:11434"
      DQ_LLM_MODEL: "qwen2.5:0.5b"
      DQ_LLM_PROBE_ON_START: "true"
      DQ_LLM_EXTRACTIVE_FALLBACK: "true"
      RUST_LOG: "info"
    volumes:
      - dqa-data:/app/data
      - ./config/default.toml:/app/config/default.toml:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  dqa-data:
  dqa-models:
