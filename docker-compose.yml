services:
  dq-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dqa-server
    restart: unless-stopped
    environment:
      DQ_SERVER_HOST: "0.0.0.0"
      DQ_SERVER_PORT: "8080"
      DQ_JWT_SECRET: "${DQA_JWT_SECRET}"
      DQ_DB_PATH: "/app/data/docqa.sqlite3"
      DQ_MODEL_DIR: "/app/models"
      DQ_EMBEDDING_OFFLINE: "true"
      DQ_OCR_ENGINE: "tesseract"
      DQ_LLM_BASE_URL: "http://localhost:11434"
      DQ_LLM_MODEL: "tinyllama"
      DQ_LLM_PROBE_ON_START: "false"
      DQ_LLM_EXTRACTIVE_FALLBACK: "true"
      RUST_LOG: "info"
    volumes:
      - dqa-data:/app/data
      - ./config/default.toml:/app/config/default.toml:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  dqa-data:
