services:
  ollama:
    image: ollama/ollama:latest
    container_name: dqa-ollama
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_CTX=1024
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Ollama ayaga kalktiktan sonra yapilandirilan modeli bir kere ceker ve cikar.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - DQA_MODEL=${DQA_LLM_MODEL:-qwen2.5:0.5b-instruct}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull \"$$DQA_MODEL\" || echo 'model cekilemedi, LLM olmadan (extractive yedek) devam edilecek'"

  dq-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dqa-server
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      DQ_SERVER_HOST: "0.0.0.0"
      DQ_SERVER_PORT: "8080"
      DQ_LLM_BASE_URL: "http://ollama:11434/v1"
      DQ_LLM_MODEL: "${DQA_LLM_MODEL:-qwen2.5:0.5b-instruct}"
      DQ_JWT_SECRET: "${DQA_JWT_SECRET}"
      DQ_DB_PATH: "/app/data/docqa.sqlite3"
      DQ_MODEL_DIR: "/app/models"
      DQ_EMBEDDING_OFFLINE: "false"
      DQ_OCR_ENGINE: "tesseract"
      RUST_LOG: "info"
    volumes:
      - dqa-data:/app/data
      - ./config/default.toml:/app/config/default.toml:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  ollama-models:
  dqa-data: