[package]
name = "dq-web"
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
gloo-net = { version = "0.7", features = ["http", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "Storage",
    "Window",
    "File",
    "FileList",
    "FormData",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Event",
]

[profile.release]
opt-level = "s"
